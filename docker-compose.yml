# TAG selects which built image to run. CI exports it as the deploying
# commit's SHA (.github/workflows/deploy.yml), so a deploy is pinned and a
# rollback is `TAG=<previous sha> docker compose up -d app`. It defaults to
# `latest` for a manual `up` on the box.
#
# Each service keeps both `image:` and `build:`. On the VPS only `image:` is
# used — the workflow pulls before it starts anything, and the VPS no longer
# compiles. Locally `docker compose build` still works and tags into the same
# name, so nothing about development changed.
#
# Logging: every service writes json-file logs, and without `max-size` those
# files grow until the disk is full and `docker logs` crawls (audit
# 2026-10-16, PERF-14). 20 MB x 5 keeps about a week of the app's output.
# Changing the logging options recreates the container on the next
# `docker compose up -d`; the deploy does that for `app` anyway.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  app:
    image: ghcr.io/hottabov/pathquote:${TAG:-latest}
    build:
      context: .
      target: run
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:3010:3000"
    env_file: .env
    # The same probe the deploy's curl loop runs, so `docker compose ps` says
    # whether the app answers and Docker restarts a hung process. busybox
    # wget: node:22-alpine has no curl.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      gotenberg:
        condition: service_started
    volumes:
      - uploads:/data/uploads
  tools:
    image: ghcr.io/hottabov/pathquote-tools:${TAG:-latest}
    build:
      context: .
      target: tools
    profiles: ["tools"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # Same uploads volume as `app`: image-import scripts write product photos,
    # option icons and region logos here, and `app` serves them from /api/files.
    # Without this mount the files land inside the throwaway tools container.
    volumes:
      - uploads:/data/uploads
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    # Stock postgres:16-alpine logs nothing about slow statements and ships no
    # pg_stat_statements, so a slow production query had nowhere to show up
    # (audit 2026-10-16, PERF-15). Statements over 500 ms, lock waits and I/O
    # timing go to the container log; pg_stat_statements needs this preload
    # plus a one-time `CREATE EXTENSION pg_stat_statements` (runbook §3b).
    # A changed command recreates the container: a few seconds without the
    # database, during the deploy that already restarts the app.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: pathquote
      POSTGRES_USER: pathquote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathquote"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    logging: *logging
volumes:
  pgdata:
  uploads:
