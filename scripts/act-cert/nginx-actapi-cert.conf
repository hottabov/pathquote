# Serve the Act! server's certificate bundle to exactly one address.
#
# The file contains a private key, so this is deliberately narrow: one
# office IP, one bearer token, no directory listing, no logging gaps.
# Include inside the server block that already answers for the VPS, then
# `nginx -t && systemctl reload nginx`.
#
# The token lives in /etc/nginx/conf.d/actapi-token.conf as:
#   map $http_authorization $actapi_token_ok { "Bearer <long-random>" 1; default 0; }
# kept out of version control.

location = /actapi-cert/actapi.pfx {
    allow 180.181.193.49;   # Pathfinder office, where the Act! server NATs out
    deny  all;

    if ($actapi_token_ok = 0) { return 403; }

    alias /var/www/actapi-cert/actapi.pfx;
    default_type application/x-pkcs12;
    add_header Cache-Control "no-store" always;
    access_log /var/log/nginx/actapi-cert.log;
}

location = /actapi-cert/expires.txt {
    allow 180.181.193.49;
    deny  all;

    if ($actapi_token_ok = 0) { return 403; }

    alias /var/www/actapi-cert/expires.txt;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    access_log /var/log/nginx/actapi-cert.log;
}
